# Application
quarkus.log.level=WARN



# Kafka Consumer
mp.messaging.incoming.coach-workload.connector=smallrye-kafka
mp.messaging.incoming.coach-workload.topic=coach-workload
mp.messaging.incoming.coach-workload.bootstrap.servers=kafka:9092
mp.messaging.incoming.coach-workload.group.id=analytics
#mp.messaging.incoming.coach-workload.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Десериализатор от SmallRye
mp.messaging.incoming.coach-workload.value.deserializer=org.acme.config.UpdateCoachWorkloadRequestDeserializer

# Указываем целевой тип данных
mp.messaging.incoming.coach-workload.value.deserializer.type=org.acme.domain.UpdateCoachWorkloadRequest



# Redis
quarkus.redis.hosts=redis://redis:6379
