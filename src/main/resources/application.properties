# Application
quarkus.application.name=analytics
quarkus.http.port=8082



# Prometheus & Micrometer
quarkus.micrometer.enabled=true

quarkus.micrometer.export.prometheus.enabled=true

quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.binder.http-server.enabled=true



# Eureka Client
#quarkus.eureka.eureka-server-url=http://localhost:8761/eureka

# Stork Registrar Config
stork.analytics.service-registrar.type=eureka
stork.analytics.service-registrar.eureka-host=localhost
stork.analytics.service-registrar.eureka-port=8761

